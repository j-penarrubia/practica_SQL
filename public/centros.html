<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centros</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="menu-sticky">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="centros.html">Centros</a></li>
                <li><a href="alumnosCursos.html">Alumnos Cursos</a></li>
                <li><a href="actualizarCursos.html">Actualizar Cursos</a></li>
                <li><a href="ratioAprobadosSuspensos.html">Mostrar Aprobados</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <table>
            <caption><h2 class=titulo-formulario>Centros</h2></caption>
            <thead>
                <tr>
                    <th>ID Centro</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">

            </tbody>
        </table>
    </main>
    <footer></footer>
    <script>
        document.addEventListener("DOMContentLoaded", async (event) => {
            try {
                fetch("/getCentros") // Llamada a la API
                    .then(response => response.json())
                    .then(centros => {


                        const cuerpoTabla = document.getElementById("cuerpo-tabla");
                        cuerpoTabla.innerHTML = "";

                        centros.forEach(centro => {
                            const fila = document.createElement("tr");
                            fila.innerHTML = `
                                <td>${centro.idCentro}</td>
                                <td>${centro.nombre}</td>
                                <td>${centro.direccion}</td>
                                            `;
                            cuerpoTabla.appendChild(fila);
                        });
                    })
            } catch (error) {
                console.error("Error obteniendo los centros:", error);
            }
        })
    </script>
</body>

</html>
